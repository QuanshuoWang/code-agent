apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spacefractions-game-hpa
  namespace: spacefractions
  labels:
    app: spacefractions
    component: game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spacefractions-game
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
