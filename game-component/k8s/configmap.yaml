apiVersion: v1
kind: ConfigMap
metadata:
  name: spacefractions-config
  namespace: spacefractions
  labels:
    app: spacefractions
data:
  NODE_ENV: "production"
  DB_HOST: "postgresql.spacefractions.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "space_fractions"
  DB_USER: "postgres"
  REDIS_HOST: "redis.spacefractions.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq.spacefractions.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  JWT_EXPIRES_IN: "1h"
  LOG_LEVEL: "info"
